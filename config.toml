baseURL = "https://mediator.sweti.de/"

languageCode = "de-de"
defaultContentLanguage = "de"

title = "Mediator Dresden | Systemische Konfliktlösung – Sweti Beltschew"
description = "Professionelle Mediation in Dresden und Sachsen. Systemischer Mediator Sweti Beltschew hilft bei Familien-, Unternehmens- und Nachbarschaftskonflikten. Jetzt Termin anfragen."

theme =  'ananke'

[outputFormats.RobotsTXT]
baseName = "robots"
mediaType = "text/plain"
isPlainText = true
notAlternative = true
permalinkable = true

[privacy]
  [privacy.youtube]
    privacyEnhanced = true


[outputs]
home = ["HTML", "RSS", "RobotsTXT"]


#Paginate = 6
[pagination]
  pagerSize = 6
  
resourceDir = "../resources"
custom_css = ["css/custom.css"]
# SectionPagesMenu = "main"

# SEO: Meta-Informationen
enableRobotsTXT = true
#[services]
#     [services.googleAnalytics]
#       ID = "G-9GV2L88RXT"

# Hugo-Features
enableGitInfo = false
enableEmoji = true

# Taxonomies
[taxonomies]
  angebote = "angebote"
  tags="tags"
  
# Sitemap Settings
[sitemap]
  changefreq = "monthly"
  priority = 0.5
  filename = "sitemap.xml"

# Params für Ananke Theme

[params]
  author = "Mediator Sweti"
  favicon = "favicon-32x32.png"  
  site_logo = "images/Sweti_Mediator_Logo_100x100.png"
# choose a background color from any on this page: https://tachyons.io/docs/themes/skins/ and preface it with "bg-"
  background_color_class = "bg-black"
  text_color = "mid-gray"
  recent_posts_number = 3
  cover_dimming_class = "bg-black-70"
  googleMapsApiKey = "AIzaSyB-ExsHpwFOby3DWnnHx_0dE-V-u3M-HOE"


[params.ananke.social]
  follow = { networks = ["linkedin", "facebook", "x-twitter", "email", "kontakt", "calendar"] }

[params.ananke.social.linkedin]
  profilelink = "https://www.linkedin.com/in/sweti/"
  username = "sweti"
  label = "LinkedIn"
  icon = "linkedin"

[params.ananke.social.facebook]
  profilelink = "https://facebook.com/mediator.sweti"
  label = "Facebook"
  icon = "facebook"

[params.ananke.social.x-twitter]
  profilelink = "https://twitter.com/sweti"
  label = "X"
  icon = "x-twitter"

[params.ananke.social.email]
	profilelink = "mailto:mediator@sweti.de"
	name = "email"
	label = "E-Mail"
    icon = "email"

[params.ananke.social.kontakt]
  profilelink = "/contact/"
  label = "Kontakt"
  icon = "kontakt"

[params.ananke.social.calendar]
  profilelink = "https://calendly.com/mediator-sweti"
  label = "Kostenloses Erstgespräch"
  icon = "calendar"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true    
	[markup.goldmark.parser]
    [markup.goldmark.parser.attribute]
        enabled = true
        block = true
        title = true



<!-- Open Graph und Twitter  -->
{{ with .Params.image }}
  {{ with $.Resources.GetMatch . }}
    <meta property="og:image" content="{{ .Permalink }}" />
    <meta name="twitter:image" content="{{ .Permalink }}" />
  {{ else }}
    <meta property="og:image" content="{{ . | absURL }}" />
    <meta name="twitter:image" content="{{ . | absURL }}" />
  {{ end }}
{{ else }}
  <meta property="og:image" content="{{ "/images/og-default.jpg" | absURL }}" />
  <meta name="twitter:image" content="{{ "/images/og-default.jpg" | absURL }}" />
{{ end }}

<!-- FAQ JSON-LD (nur wenn faq im Front Matter) -->

{{- with .Params.faq }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {
      "@type": "Question",
      "name": "Was kostet ein Mediator in Dresden?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Die Kosten hängen von Art des Konflikts, Anzahl der Beteiligten und Eskalationsgrad ab und werden vorab transparent vereinbart."
      }
    },
    {
      "@type": "Question",
      "name": "Wie lange dauert eine Mediation?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Viele Konflikte lassen sich in 1–3 Sitzungen klären. Komplexe Fälle benötigen mehr Zeit."
      }
    },
    {
      "@type": "Question",
      "name": "Ist Mediation vertraulich?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Ja. Alle Inhalte einer Mediation unterliegen der Vertraulichkeit."
      }
    },
    {
      "@type": "Question",
      "name": "Kann Mediation ein Gerichtsverfahren ersetzen?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "In vielen Fällen kann Mediation helfen, gerichtliche Auseinandersetzungen zu vermeiden oder vorzubereiten. Sie ersetzt jedoch keine rechtliche Beratung."
      }
    }
  ]
}
</script>
{{- end }}
